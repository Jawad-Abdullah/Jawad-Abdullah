<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.5" stop-color="#020806"/>
      <stop offset="1" stop-color="#00110b"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSmall" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="280" fill="url(#bg)"/>
  <rect width="900" height="280" fill="none" stroke="#0d3a2a" stroke-width="1.5"/>

  <!-- matrix rain columns -->
  <g font-family="Consolas, monospace" font-size="13" fill="#00FF66" opacity="0.35">
    <text x="18" y="0">01<animate attributeName="y" values="-20;300" dur="3.1s" repeatCount="indefinite" begin="0s"/></text>
    <text x="55" y="0">10 1 0<animate attributeName="y" values="-20;300" dur="2.4s" repeatCount="indefinite" begin="0.4s"/></text>
    <text x="95" y="0">A F 3<animate attributeName="y" values="-20;300" dur="3.6s" repeatCount="indefinite" begin="1.1s"/></text>
    <text x="140" y="0">$#01<animate attributeName="y" values="-20;300" dur="2.8s" repeatCount="indefinite" begin="0.2s"/></text>
    <text x="750" y="0">7C 01<animate attributeName="y" values="-20;300" dur="3.3s" repeatCount="indefinite" begin="0.7s"/></text>
    <text x="800" y="0">0 1 F<animate attributeName="y" values="-20;300" dur="2.6s" repeatCount="indefinite" begin="1.4s"/></text>
    <text x="840" y="0">3E9A<animate attributeName="y" values="-20;300" dur="3.9s" repeatCount="indefinite" begin="0.1s"/></text>
    <text x="200" y="0">0xFF<animate attributeName="y" values="-20;300" dur="3.0s" repeatCount="indefinite" begin="1.8s"/></text>
    <text x="650" y="0">1010<animate attributeName="y" values="-20;300" dur="2.9s" repeatCount="indefinite" begin="0.9s"/></text>
  </g>

  <!-- decorative nodes -->
  <circle cx="70" cy="40" r="3" fill="#00FFC2" opacity="0.7"/>
  <circle cx="830" cy="55" r="2.5" fill="#00FFC2" opacity="0.5"/>
  <circle cx="810" cy="230" r="3" fill="#00FFC2" opacity="0.6"/>

  <!-- glitch title: base layer -->
  <text x="450" y="120" text-anchor="middle" font-family="Consolas, monospace" font-weight="bold"
        font-size="40" fill="#00FF9C" filter="url(#glow)" letter-spacing="3">JAWAD ABDULLAH KHAN</text>

  <!-- glitch title: red offset layer -->
  <text x="452" y="119" text-anchor="middle" font-family="Consolas, monospace" font-weight="bold"
        font-size="40" fill="#FF2E63" letter-spacing="3" opacity="0.85">
    JAWAD ABDULLAH KHAN
    <animate attributeName="x" values="452;452;456;448;452;452" keyTimes="0;0.82;0.85;0.88;0.91;1" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.82;0.85;0.88;0.91;1" dur="4.5s" repeatCount="indefinite"/>
  </text>

  <!-- glitch title: cyan offset layer -->
  <text x="448" y="121" text-anchor="middle" font-family="Consolas, monospace" font-weight="bold"
        font-size="40" fill="#00E5FF" letter-spacing="3" opacity="0.85">
    JAWAD ABDULLAH KHAN
    <animate attributeName="x" values="448;448;444;452;448;448" keyTimes="0;0.82;0.85;0.88;0.91;1" dur="4.5s" repeatCount="indefinite" begin="0.1s"/>
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.82;0.85;0.88;0.91;1" dur="4.5s" repeatCount="indefinite" begin="0.1s"/>
  </text>

  <rect x="300" y="140" width="300" height="2.5" rx="1.5" fill="#00FF9C" opacity="0.85"/>

  <!-- role tag -->
  <text x="450" y="172" text-anchor="middle" font-family="Verdana, Segoe UI, sans-serif" font-size="16"
        fill="#8CFFC8">Cyber Security Student &amp; Penetration Testing Enthusiast</text>

  <!-- stamped badge -->
  <g transform="translate(450,205)">
    <rect x="-160" y="-16" width="320" height="34" rx="17" fill="none" stroke="#00FF9C" stroke-width="1.4" filter="url(#glowSmall)"/>
    <text x="0" y="6" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#00FF9C" letter-spacing="1.5">🔐 CYBER SECURITY STUDENT · 5th SEMESTER</text>
  </g>

  <text x="450" y="248" text-anchor="middle" font-family="Consolas, monospace" font-size="13"
        fill="#3f9c74">root@jawad:~# whoami → breaking things to build them safer</text>
</svg>
